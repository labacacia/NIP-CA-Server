name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore NPS.NipCaServer.csproj
      - run: dotnet build NPS.NipCaServer.csproj --configuration Release --no-restore
      - run: docker build --tag nps-nip-ca:ci .
